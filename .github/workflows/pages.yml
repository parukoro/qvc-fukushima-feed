name: Refresh official QVC Fukushima appearances

on:
  schedule:
    # Once a day at 20:43 UTC (05:43 JST), away from the crowded start of the hour.
    # Clients keep using the data for 36 hours, which covers GitHub's delayed or skipped schedules.
    - cron: '43 20 * * *'
  workflow_dispatch:
  push:
    branches: [codex/qvc-live-validation]

# Read-only by default; only record-facts can write genuine programme changes.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'qvc-live-validation' || 'qvc-guest-pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      programme_facts: ${{ steps.facts.outputs.facts }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verified 2026-11-01
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 verified 2026-11-01
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check extraction and expiry handling
        run: npm test
      - name: Inspect the official HTTP response for today's guide
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'JS'
          import { dailyDates, dailySource, parseDailyHtml } from './daily.mjs';

          const date = dailyDates()[0];
          const source = dailySource(date);
          const response = await fetch(source, {
            redirect: 'error',
            signal: AbortSignal.timeout(30_000),
            headers: { Accept: 'text/html' }
          });
          if (!response.ok) {
            const chunks = [];
            let remaining = 8192;
            for await (const chunk of response.body ?? []) {
              const prefix = chunk.subarray(0, remaining);
              chunks.push(prefix);
              remaining -= prefix.length;
              if (!remaining) break;
            }
            const excerpt = Buffer.concat(chunks).toString('utf8');
            const contentType = response.headers.get('content-type')?.match(/^[\w.+-]+\/[\w.+-]+/)?.[0];
            const signals = {
              automationDenied: /(?:automated (?:traffic|requests?|access) (?:is |are )?(?:denied|blocked|not allowed)|bots? (?:are |is )?(?:blocked|not allowed))/i.test(excerpt),
              humanVerification: /(?:verify (?:that )?you are human|confirm you are (?:a )?human|verify you are not a robot)/i.test(excerpt),
              accessDenied: /(?:access denied|you don.t have permission to access|request blocked|アクセスが拒否)/i.test(excerpt)
            };
            console.log(JSON.stringify({ source, status: response.status, contentType, bodyBytesInspected: 8192 - remaining, ...signals }));
            process.exitCode = 1;
          } else {
            const rows = parseDailyHtml(await response.text(), date);
            console.log(`Official guide ${date} returned HTTP ${response.status} with ${rows.length} validated programmes`);
          }
          JS
      - name: Install ordinary full Chromium
        run: npx --no-install playwright install --with-deps chromium --no-shell
      - name: Export fresh official guest and eight-day QVC guides
        id: export
        env:
          QVC_FEED_BROWSER_MODE: headed
        run: xvfb-run -a npm run export
      - name: Validate generated feeds without deploying
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { dailyDates, validateWeeklyFeed } from './daily.mjs';
          import { responseFor, validateSavedFeed } from './feed.mjs';

          const read = async path => JSON.parse(await readFile('public/' + path, 'utf8'));
          const now = Date.now();
          const weekly = await read('weekly.json');
          assert.equal(weekly.startDate, dailyDates(now)[0], 'Weekly guide must start today in JST');
          assert.ok(Date.parse(weekly.expiresUtc) > now, 'Weekly guide must be unexpired');
          assert.ok(validateWeeklyFeed(weekly, Date.parse(weekly.retrievedUtc)), 'Invalid weekly guide');
          for (const day of weekly.days) {
            assert.deepEqual(await read('daily/' + day.date + '.json'), day);
          }
          console.log(`Validated ${weekly.days.length} complete daily guides from ${weekly.startDate}, expiring ${weekly.expiresUtc}`);

          const guest = await read('qvc-fukushima.json');
          assert.ok(validateSavedFeed(guest) && responseFor(guest, now).body.status === 'fresh', 'Invalid or expired guest feed');
          console.log(`Validated ${guest.programmes.length} guest appearances, expiring ${guest.expiresUtc}`);
          JS
      - name: Check guest acquisition separately if export failed
        if: failure() && github.event_name == 'push' && steps.export.outcome == 'failure'
        run: |
          xvfb-run -a node --input-type=module <<'JS'
          import { scrapeOfficialGuest } from './scraper.mjs';
          const guest = await scrapeOfficialGuest({ browserMode: 'headed' });
          console.log(`Guest acquisition yielded ${guest.programmes.length} appearances, expiring ${guest.expiresUtc}`);
          JS
      - name: Prepare canonical programme facts without refresh timestamps
        id: facts
        # Skipped when this run published the guides without a guest feed.
        if: github.event_name != 'push' && hashFiles('public/qvc-fukushima.json') != ''
        run: node record-facts.mjs --output-for-actions
      - name: Upload only generated public files
        if: github.event_name != 'push'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4 verified 2026-11-01
        with:
          path: public
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy fresh artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 verified 2026-11-01

  record-facts:
    needs: [build, deploy]
    if: needs.build.outputs.programme_facts != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout current default branch for factual change record
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verified 2026-11-01
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Set up Node 22 without dependency installation
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 verified 2026-11-01
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Commit only a genuine programme-list change
        env:
          QVC_FACTS_JSON: ${{ needs.build.outputs.programme_facts }}
          QVC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node record-facts.mjs --commit-changed-facts
