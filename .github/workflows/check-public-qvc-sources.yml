name: Extract QVC NextQ planned programmes
on:
  push:
    branches: [main, codex/qvc-official-source-check]
    paths:
      - '.github/workflows/check-public-qvc-sources.yml'
      - 'probe-official-sources.mjs'
      - 'daily.mjs'
  schedule:
    - cron: '53 20 * * *'
permissions:
  contents: read
concurrency:
  group: qvc-nextq-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Extract and validate eight days of printed NextQ plans
        run: node probe-official-sources.mjs nextq-planned.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nextq-planned-guide
          path: nextq-planned.json
          if-no-files-found: error
          retention-days: 3
